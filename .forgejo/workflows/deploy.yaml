name: Build and Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Nodeveil Engine
        run: |
          echo "Triggering Nodeveil zero-downtime deployment for ${{ github.event.repository.name }}..."
          RESPONSE=$(curl -s -X POST http://nodeveil-admin:3001/api/platform/webhook/deploy \
            -H "Content-Type: application/json" \
            -d "{\"repo\": \"${{ github.event.repository.name }}\", \"branch\": \"${{ github.ref_name }}\"}")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Deployment successfully finished!"
          else
            echo "Deployment failed!"
            exit 1
          fi

